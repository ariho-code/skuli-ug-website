      <path d="M 325 356 C 368 331 420 323 466 328 L 472 360 C 424 355 370 366 325 386 Z" fill="#FFFFFF" stroke="#B69C56" stroke-width="3"/>
      <path d="M 315 386 C 270 366 216 355 168 360 L 163 388 C 213 383 269 394 315 414 Z" fill="url(#pcs-page)"/>
      <path d="M 325 386 C 370 366 424 355 472 360 L 477 388 C 427 383 371 394 325 414 Z" fill="url(#pcs-page)"/>
      <path d="M 315 414 C 269 394 213 383 163 388 L 158 410 C 210 405 268 417 315 436 Z" fill="#9C8244"/>
      <path d="M 325 414 C 371 394 427 383 477 388 L 482 410 C 430 405 372 417 325 436 Z" fill="#9C8244"/>
