    <g stroke="#141414" fill="none" stroke-linecap="round">
      <path d="M 312 336 C 296 352 268 358 240 356" stroke-width="7"/>
      <path d="M 328 336 C 344 352 372 358 400 356" stroke-width="7"/>
      <path d="M 306 340 C 288 362 258 372 226 374" stroke-width="5"/>
      <path d="M 334 340 C 352 362 382 372 414 374" stroke-width="5"/>
      <path d="M 300 344 C 286 368 268 384 246 394" stroke-width="3.5"/>
