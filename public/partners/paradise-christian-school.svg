      <circle cx="266" cy="196" r="42" fill="url(#pcs-leafB)"/>
      <circle cx="374" cy="196" r="42" fill="url(#pcs-leafB)"/>
      <circle cx="232" cy="228" r="36" fill="url(#pcs-leafA)"/>
      <circle cx="408" cy="228" r="36" fill="url(#pcs-leafA)"/>
      <circle cx="288" cy="228" r="40" fill="url(#pcs-leafA)"/>
      <circle cx="352" cy="228" r="40" fill="url(#pcs-leafA)"/>
      <circle cx="256" cy="262" r="32" fill="url(#pcs-leafB)"/>
      <circle cx="384" cy="262" r="32" fill="url(#pcs-leafB)"/>
      <circle cx="320" cy="248" r="34" fill="url(#pcs-leafB)"/>
      <circle cx="212" cy="262" r="24" fill="url(#pcs-leafB)"/>
      <circle cx="428" cy="262" r="24" fill="url(#pcs-leafB)"/>
      <circle cx="292" cy="150" r="26" fill="url(#pcs-leafB)"/>
      <circle cx="348" cy="150" r="26" fill="url(#pcs-leafB)"/>
