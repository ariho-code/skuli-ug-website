    <path d="M 409.0 150.4 A 168 200 0 0 1 409.0 489.6" stroke-width="9"/>
    <path d="M 218.3 130.0 A 192 224 0 0 0 218.3 510.0" stroke-width="12"/>
    <path d="M 231.0 150.4 A 168 200 0 0 0 231.0 489.6" stroke-width="9"/>
    <g stroke-width="8">
      <path d="M 512 320 L 488 320"/>
      <path d="M 482.8 201.3 L 462.5 214.0"/>
      <path d="M 482.8 438.7 L 462.5 426.0"/>
      <path d="M 128 320 L 152 320"/>
      <path d="M 157.2 201.3 L 177.5 214.0"/>
      <path d="M 157.2 438.7 L 177.5 426.0"/>
    </g>
  </g>

