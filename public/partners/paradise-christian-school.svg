      <path d="M 326 286 C 344 272 360 258 372 240" stroke-width="8"/>
      <path d="M 313 258 C 300 244 288 232 274 220" stroke-width="6"/>
      <path d="M 327 258 C 340 244 352 232 366 220" stroke-width="6"/>
      <path d="M 320 240 C 318 218 316 202 312 186" stroke-width="6"/>
      <path d="M 320 240 C 324 218 328 202 334 186" stroke-width="6"/>
      <path d="M 280 252 C 268 240 258 232 246 226" stroke-width="4"/>
      <path d="M 360 252 C 372 240 382 232 394 226" stroke-width="4"/>
