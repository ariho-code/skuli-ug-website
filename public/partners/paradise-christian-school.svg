    <path id="pcs-arc-top"    d="M 76 340 A 244 268 0 0 1 564 340"/>
    <path id="pcs-arc-bottom" d="M 90 356 A 230 232 0 0 0 550 356"/>
  </defs>

  <circle cx="320" cy="320" r="320" fill="#FFFFFF"/>

