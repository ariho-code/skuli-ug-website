    <textPath href="#pcs-arc-bottom" startOffset="50%">BE THE LIGHT</textPath>
  </text>

  <!-- Flame flourishes flanking the motto -->
  <g fill="#A18A4B">
    <path d="M 104 418 C 88 440 86 462 100 480 C 92 460 100 444 114 432 C 108 443 110 454 118 462 C 122 443 116 429 104 418 Z"/>
    <path d="M 128 430 C 114 449 113 468 125 483 C 118 466 125 452 137 442 C 132 452 134 461 141 468 C 144 451 139 440 128 430 Z"/>
    <path d="M 536 418 C 552 440 554 462 540 480 C 548 460 540 444 526 432 C 532 443 530 454 522 462 C 518 443 524 429 536 418 Z"/>
    <path d="M 512 430 C 526 449 527 468 515 483 C 522 466 515 452 503 442 C 508 452 506 461 499 468 C 496 451 501 440 512 430 Z"/>
